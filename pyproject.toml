[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-repurposing-rag"
version = "0.1.0"
description = "RAG Engine for Computational Drug Repurposing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Data processing
    "pandas>=2.1",
    "numpy>=1.24",
    "tqdm>=4.66",

    # NLP / Biomedical
    "spacy>=3.7",
    "scispacy>=0.5.5",
    "nltk>=3.8",
    "pubmed-parser>=0.5",

    # Embeddings
    "sentence-transformers>=2.5",
    "torch>=2.1",
    "transformers>=4.36",

    # Vector store
    "chromadb>=0.4.22",
    "rank-bm25>=0.2.2",

    # LLM clients
    "ollama>=0.2",
    "openai>=1.12",

    # Utilities
    "requests>=2.31",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "pre-commit>=3.6",
    "ipykernel>=6.27",
    "jupyter>=1.0",
]
eval = [
    "datasets>=2.16",
    "scikit-learn>=1.3",
]
download = [
    "biopython>=1.83",
    "ftfy>=6.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "ARG", "PTH", "ERA", "PL", "TRY"]
ignore = ["S101", "TRY003", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", "notebooks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]